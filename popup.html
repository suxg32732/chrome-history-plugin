<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>最近浏览记录</title>
  </head>
  <body>
    <header class="hd">
      <span class="hd-title">最近浏览记录</span>
      <input
        id="search"
        class="search"
        type="text"
        placeholder="过滤标题或网址"
        aria-label="过滤标题或网址"
        autocomplete="off"
        spellcheck="false"
      />
    </header>
    <ul id="list" class="list"></ul>
    <div id="status" class="status">加载中…</div>
    <button id="showAll" class="show-all" type="button">显示所有历史</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
